# onesilo-node + Ollama sidecar.
#
#   export SILO_API_KEY=sc_...     # see docs/deploy-docker.md ("Attach to your Silo account")
#   docker compose up -d
#
# Env var names come from the settings table in internal/config/load.go
# (`onesilo-node -h` lists all of them).
services:
  onesilo-node:
    build: .
    image: onesilo-node:local
    restart: unless-stopped
    environment:
      # sc_ API key from your Silo account (required; passed through from host).
      SILO_API_KEY: ${SILO_API_KEY:?set SILO_API_KEY to an sc_ key from your Silo account}
      # Optional: guards the localhost admin API inside the container.
      ONESILO_NODE_ADMIN_TOKEN: ${ONESILO_NODE_ADMIN_TOKEN:-}
      # Capabilities this node contributes.
      ONESILO_NODE_MEMORY: "true"
      ONESILO_NODE_COMPUTE: "true"
      ONESILO_NODE_CONTROL_PLANE_URL: ${ONESILO_NODE_CONTROL_PLANE_URL:-https://api.onesilo.com}
      ONESILO_NODE_AUTH_MODE: api_key
      ONESILO_NODE_OLLAMA_HOST: http://ollama:11434
      # Ephemeral Cloudflare quick tunnel; the cloudflared binary ships in the
      # image. For a stable hostname use a named tunnel instead
      # (ONESILO_NODE_TUNNEL_MODE=external — see docs/deploy-docker.md).
      ONESILO_NODE_TUNNEL_MODE: quick
      ONESILO_NODE_CLOUDFLARED_PATH: /cloudflared
      ONESILO_NODE_LOG_FORMAT: json
    volumes:
      - silo-data:/data
    depends_on:
      ollama:
        condition: service_healthy
    # The admin API (8766) binds 127.0.0.1 inside the container and is never
    # publishable. Uncomment to expose LAN serving (Bonjour discovery does not
    # cross the Docker network boundary; clients must connect by IP):
    # ports:
    #   - "8765:8765"

  ollama:
    image: ollama/ollama:0.31.1@sha256:f1a705f2bd113fb8d15f85f7c217f0dc5f6bebda6b0cc42b82c3ad165ffcb9dc
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      # The image has no curl/wget; the ollama CLI talks to the local server,
      # so `ollama ps` fails until the API answers.
      test: ["CMD", "ollama", "ps"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  silo-data:
  ollama-models:
