# onesilo-node example configuration
#
# Copy to ~/.onesilo-node/config.toml (or pass -config /path/to/config.toml).
# Every key can also be set by environment variable or CLI flag; precedence
# is: flags > SILO_NODE_* env > this file > built-in defaults.
# Run `onesilo-node -h` for the full flag/env list.

# What this node is:
#   "local"   - self-contained: local memory and local LLM only. The node
#               never talks to the One Silo control plane (tunnels are
#               rejected by validation).
#   "gateway" - control-plane relay: connects to One Silo with this node's
#               credentials (see [control_plane]) and exposes the cloud
#               surface — cloud silos, connectors, MCP — to local clients
#               at /v1/cloud/* on lan.port (X-Silo-Node-Key authenticated).
#               Tunnels and destination registration also require this mode.
# env: SILO_NODE_MODE
mode = "local"

# Directory for node state: device_id, pairing.key, and the persisted config
# when it is updated through the admin API. "~" is expanded.
# env: SILO_NODE_DATA_DIR
data_dir = "~/.onesilo-node"

[log]
# Output format: "text" (human-friendly) or "json" (log shippers).
format = "text"
# One of: debug, info, warn, error.
level = "info"

[capabilities]
# Each capability is independently enable-able. The node registers with the
# control plane only while at least one capability is enabled AND a public
# URL is available (see [tunnel]).

# Memory: silo recall/remember served from this node (SQLite + FTS5 at
# <data_dir>/memory.db). The memory HTTP API is served on lan.port — the
# LAN server starts whenever this is true, even with lan.enabled = false.
# Requests are authenticated with the X-Silo-Node-Key header; the key is
# generated on first start at <data_dir>/node.key and exposed through the
# admin API's GET /v1/status.
memory = false

# Compute: local LLM inference backed by Ollama.
compute = false

[control_plane]
# Base URL of the Silo backend.
# env: SILO_NODE_CONTROL_PLANE_URL
url = "https://api.onesilo.com"

# How the node authenticates to the control plane:
#   "jwt"     - the Silo Desktop app pushes a short-lived Clerk JWT through
#               the admin API (POST /v1/auth/jwt). Default for the bundled
#               desktop deployment.
#   "api_key" - an sc_ API key read from the SILO_API_KEY environment
#               variable. Use this for Docker / headless deployments.
#   "oauth"   - the credential stored by the `onesilo-node setup` sign-in step
#               (<data_dir>/oauth.json): the node holds its own OAuth grant
#               — like the Silo iOS app — refreshes tokens automatically,
#               and appears as a revocable connection in your dashboard.
auth_mode = "jwt"

# Name shown in the Silo apps for this node. Defaults to the hostname.
device_name = ""

[memory]
# Ollama embedding model for hybrid recall. Used only while the compute
# capability is enabled; when compute is off (or the model isn't pulled),
# recall degrades to FTS5 keyword search and remember skips embeddings.
embed_model = "nomic-embed-text"

[ollama]
# Base URL of the Ollama server the compute capability uses.
host = "http://127.0.0.1:11434"

# When true and no server answers at `host`, onesilo-node spawns `ollama serve`
# itself (searching binary_path, $PATH, /opt/homebrew/bin, /usr/local/bin)
# and stops it again when the capability stops. When false, an unreachable
# server is reported as unhealthy instead.
manage = false

# Preferred model tag. If it isn't installed, the node advertises the first
# installed model instead, so an unconfigured machine still serves.
default_model = "llama3.2:3b"

# Optional explicit path to the ollama binary (managed mode only).
binary_path = ""

[tunnel]
# How this node becomes reachable from outside the local network.
#   "off"      - no public URL; the node never registers with the control plane.
#   "managed"  - preferred: One Silo provisions a named Cloudflare tunnel with
#                a stable hostname for this node (paid feature; running the
#                node locally is always free). The node fetches a run token at
#                start and spawns `cloudflared tunnel run`.
#   "quick"    - spawn an ephemeral Cloudflare quick tunnel (`cloudflared
#                tunnel --url http://localhost:<lan.port>`). The URL changes
#                on every restart; the node re-registers automatically.
#   "external" - you run your own ingress (named Cloudflare tunnel, reverse
#                proxy); set external_url to its public https URL.
mode = "off"

# Optional explicit path to cloudflared (managed/quick modes). Defaults to
# searching /opt/homebrew/bin, /usr/local/bin, then $PATH.
cloudflared_path = ""

# Required when mode = "external". Note the control plane accepts only
# *.trycloudflare.com / *.cfargotunnel.com / managed One Silo hostnames.
external_url = ""

[lan]
# Local-network LLM serving: Bonjour discovery (_silo-llm._tcp) plus the
# E2E-encrypted WebSocket protocol the Silo iOS app speaks (see
# docs/protocol.md). Requires the compute capability to answer chat.
# NOTE: the LAN server also starts when capabilities.memory or
# openai.enabled is true — those APIs ride the same port. enabled=false then only means no Bonjour
# announcement and no LLM chat; the port is still bound.
# The quick tunnel targets this port as well.
enabled = false
port = 8765

# Hard-gate automated pairing (see docs/automated-pairing.md). When true, an
# app identity key seen for the first time is pinned but cannot run inference
# until its short authentication string (SAS) is confirmed in the admin UI —
# this is what catches a control plane that substituted keys. Set false to
# trust-on-first-use without the manual comparison.
require_pairing_verification = true

[openai]
# OpenAI-compatible inference surface: /v1/chat/completions, /v1/completions,
# /v1/models and /v1/embeddings on lan.port (and through any configured
# tunnel), reverse-proxied to Ollama's native OpenAI-compatible API. Lets
# third-party tools (IDEs, SDKs — anything that takes an OpenAI base URL +
# API key) use this node's local model.
# Auth: bearer API keys minted via the admin API (POST /v1/openai/keys) or
# the desktop app. Requires capabilities.compute.
# NOTE: unlike the Silo app protocol this surface is NOT end-to-end
# encrypted — through a managed/quick tunnel, the tunnel edge can read this
# traffic. Use tunnel.mode = "external" behind your own ingress if that
# matters, or keep it LAN-only.
enabled = false

# Publish an API key for this surface to the control plane at registration,
# so One Silo can run inference on this node on your behalf. Indexing a
# space artifact you marked "local_only" is the first thing that uses it:
# the control plane sends the extracted text here instead of to a
# third-party cloud model, which is the whole point of that boundary.
#
# Off by default and separate from `enabled` on purpose. Enabling the
# surface says "clients I hand a key to may use my hardware"; this says
# "One Silo may mint itself one". That is a grant over your GPU, so the
# node will not assume it.
#
# The key is minted fresh on each registration and the one it replaces is
# revoked once the new one lands — the node stores only hashes, so a key it
# has already published can never be re-sent, and rotating is what keeps the
# control plane from being stranded with a key it lost. Your own IDE/SDK
# keys are untouched by that rotation — rotation matches on an internal
# scope, not on the key's name, so calling one of your own keys
# "control-plane" is just a name and costs you nothing.
#
# Turning this back off stops renewing the grant; it does not revoke the key
# already granted. Revoke it through the admin API when you mean to.
# Requires openai.enabled.
publish_key_to_control_plane = false

[admin]
# Localhost-only admin API port. The Silo Desktop app drives the node
# through this API; it is authenticated with the SILO_NODE_ADMIN_TOKEN
# environment variable (all routes except GET /healthz).
port = 8766
