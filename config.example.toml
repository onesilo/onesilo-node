# silo-node example configuration
#
# Copy to ~/.silo-node/config.toml (or pass -config /path/to/config.toml).
# Every key can also be set by environment variable or CLI flag; precedence
# is: flags > SILO_NODE_* env > this file > built-in defaults.
# Run `silo-node -h` for the full flag/env list.

# What this node is:
#   "local"   - self-contained: local memory and local LLM only. The node
#               never talks to the One Silo control plane (tunnels are
#               rejected by validation).
#   "gateway" - control-plane relay: connects to One Silo with this node's
#               credentials (see [control_plane]) and exposes the cloud
#               surface — cloud silos, connectors, MCP — to local clients
#               at /v1/cloud/* on lan.port (X-Silo-Node-Key authenticated).
#               Tunnels and destination registration also require this mode.
# env: SILO_NODE_MODE
mode = "local"

# Directory for node state: device_id, pairing.key, and the persisted config
# when it is updated through the admin API. "~" is expanded.
# env: SILO_NODE_DATA_DIR
data_dir = "~/.silo-node"

[log]
# Output format: "text" (human-friendly) or "json" (log shippers).
format = "text"
# One of: debug, info, warn, error.
level = "info"

[capabilities]
# Each capability is independently enable-able. The node registers with the
# control plane only while at least one capability is enabled AND a public
# URL is available (see [tunnel]).

# Memory: silo recall/remember served from this node (SQLite + FTS5 at
# <data_dir>/memory.db). The memory HTTP API is served on lan.port — the
# LAN server starts whenever this is true, even with lan.enabled = false.
# Requests are authenticated with the X-Silo-Node-Key header; the key is
# generated on first start at <data_dir>/node.key and exposed through the
# admin API's GET /v1/status.
memory = false

# Compute: local LLM inference backed by Ollama.
compute = false

[control_plane]
# Base URL of the Silo backend.
# env: SILO_NODE_CONTROL_PLANE_URL
url = "https://api.onesilo.com"

# How the node authenticates to the control plane:
#   "jwt"     - the Silo Desktop app pushes a short-lived Clerk JWT through
#               the admin API (POST /v1/auth/jwt). Default for the bundled
#               desktop deployment.
#   "api_key" - an sc_ API key read from the SILO_API_KEY environment
#               variable. Use this for Docker / headless deployments.
auth_mode = "jwt"

# Name shown in the Silo apps for this node. Defaults to the hostname.
device_name = ""

[memory]
# Ollama embedding model for hybrid recall. Used only while the compute
# capability is enabled; when compute is off (or the model isn't pulled),
# recall degrades to FTS5 keyword search and remember skips embeddings.
embed_model = "nomic-embed-text"

[ollama]
# Base URL of the Ollama server the compute capability uses.
host = "http://127.0.0.1:11434"

# When true and no server answers at `host`, silo-node spawns `ollama serve`
# itself (searching binary_path, $PATH, /opt/homebrew/bin, /usr/local/bin)
# and stops it again when the capability stops. When false, an unreachable
# server is reported as unhealthy instead.
manage = false

# Preferred model tag. If it isn't installed, the node advertises the first
# installed model instead, so an unconfigured machine still serves.
default_model = "llama3.2:3b"

# Optional explicit path to the ollama binary (managed mode only).
binary_path = ""

[tunnel]
# How this node becomes reachable from outside the local network.
# Requires mode = "gateway" for anything but "off".
#   "off"      - no public URL; the node never registers with the control plane.
#   "quick"    - spawn an ephemeral Cloudflare quick tunnel (`cloudflared
#                tunnel --url http://localhost:<lan.port>`). The URL changes
#                on every restart; the node re-registers automatically.
#   "external" - you run your own ingress (named Cloudflare tunnel, reverse
#                proxy); set external_url to its public https URL.
mode = "off"

# Optional explicit path to cloudflared (quick mode). Defaults to searching
# /opt/homebrew/bin, /usr/local/bin, then $PATH.
cloudflared_path = ""

# Required when mode = "external". Note the control plane currently accepts
# only *.trycloudflare.com / *.cfargotunnel.com hostnames.
external_url = ""

[lan]
# Local-network LLM serving: Bonjour discovery (_silo-llm._tcp) plus the
# E2E-encrypted WebSocket protocol the Silo iOS app speaks (see
# docs/protocol.md). Requires the compute capability to answer chat.
# NOTE: the LAN server also starts when capabilities.memory is true — the
# memory API rides the same port. enabled=false then only means no Bonjour
# announcement and no LLM chat; the port is still bound.
# The quick tunnel targets this port as well.
enabled = false
port = 8765

[admin]
# Localhost-only admin API port. The Silo Desktop app drives the node
# through this API; it is authenticated with the SILO_NODE_ADMIN_TOKEN
# environment variable (all routes except GET /healthz).
port = 8766
