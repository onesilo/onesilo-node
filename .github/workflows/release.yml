name: Release

on:
  push:
    tags: ['v*']
  # Dry run: builds and verifies everything, publishes nothing.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string for a dry-run build (no release, no push)'
        required: false
        default: 'v0.0.0-dryrun'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify and tag
    runs-on: ubuntu-latest
    permissions:
      # Only what this job needs: it creates the release. Attestation
      # permissions live on the image job, which is what gets attested.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags and full history so `git describe` resolves for the
          # changelog link and the script's version fallback.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          # MUST match the builder image in Dockerfile (FROM golang:X.Y.Z).
          # Different Go versions emit different machine code, so a mismatch
          # silently breaks the property that the binary in an archive and
          # the one inside the image are identical for a commit. ci.yml
          # deliberately uses the go.mod floor instead — it tests the oldest
          # supported toolchain; this job ships bytes.
          go-version: '1.26.4'
          cache: true

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      # Nothing here is published — releases ship as a container image. This
      # gates the tag: every supported platform must build, and each must be
      # reproducible across a double build. darwin is included because
      # SiloDesktop bundles this daemon for macOS.
      - name: Verify every platform builds reproducibly
        env:
          VERSION: ${{ steps.v.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: scripts/verify-builds.sh

      - name: Verify the built binary runs and reports its version
        env:
          VERSION: ${{ steps.v.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -buildid= \
              -X github.com/onesilo/onesilo-node/internal/version.Version=${VERSION} \
              -X github.com/onesilo/onesilo-node/internal/version.Commit=${COMMIT}" \
            -o "$RUNNER_TEMP/onesilo-node" ./cmd/onesilo-node
          out="$("$RUNNER_TEMP/onesilo-node" -version)"
          echo "$out"
          # Output is: onesilo-node <version> (<commit>)
          # Compare the version field exactly rather than substring-matching
          # for the "dev"/"none" fallbacks — a legitimate tag like
          # v1.0.0-dev.1 contains "dev" and would false-positive, while an
          # exact match still catches the fallback, since "dev" is never
          # equal to the tag. A missed ldflags path compiles and passes every
          # test; this is the only place it surfaces.
          got="$(printf '%s\n' "$out" | awk '{print $2}')"
          want='${{ steps.v.outputs.version }}'
          if [ "$got" != "$want" ]; then
            echo "::error::version is '$got', expected '$want' (full output: $out)"
            exit 1
          fi

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          REPO='${{ github.repository }}'

          # Previous tag, for the changelog link. Empty on the first release.
          prev="$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || true)"

          # gh rejects more than one of --notes/--notes-file/--generate-notes,
          # so the notes are assembled here rather than mixing flags.
          {
            echo "onesilo-node ships as a container image. There are no binary"
            echo "downloads — see the README for why, and for running it from source."
            echo
            echo '```'
            echo "docker pull ghcr.io/${REPO}:${VERSION}"
            echo '```'
            echo
            echo "The image is reproducible for this commit, and its build provenance"
            echo "is attested — verify what you pulled actually came from this tag:"
            echo
            echo '```'
            echo "gh attestation verify oci://ghcr.io/${REPO}:${VERSION} --repo ${REPO}"
            echo '```'
            echo
            echo "From source, at this tag:"
            echo
            echo '```'
            echo "go install github.com/${REPO}/cmd/onesilo-node@${VERSION}"
            echo '```'
            if [ -n "$prev" ]; then
              echo
              echo "**Changelog:** https://github.com/${REPO}/compare/${prev}...${VERSION}"
            fi
          } > "$RUNNER_TEMP/notes.md"

          # Anything with a hyphen after the version core (v0.2.0-rc.1) is a
          # prerelease; plain vX.Y.Z is not.
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac

          # No assets: the release is a tag with notes pointing at the image.
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            $prerelease

  image:
    name: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push to ghcr.io
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve version and build clock
        id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      # Multi-platform, so this cannot use scripts/build-image.sh — that
      # script's `--output type=docker` is single-platform by design, for
      # local double-build verification. The build args, SOURCE_DATE_EPOCH
      # and rewrite-timestamp below are deliberately identical to it; keep
      # them in step if either changes.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          provenance: false
          outputs: type=image,rewrite-timestamp=true
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            COMMIT=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.v.outputs.epoch }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

      - uses: actions/attest-build-provenance@v2
        if: github.event_name == 'push'
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
