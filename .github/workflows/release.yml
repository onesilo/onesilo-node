name: Release

on:
  push:
    tags: ['v*']
  # Dry run: builds and verifies everything, publishes nothing.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string for a dry-run build (no release, no push)'
        required: false
        default: 'v0.0.0-dryrun'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binaries:
    name: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release
      id-token: write       # provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags and full history so the script's `git describe` and
          # commit-timestamp SOURCE_DATE_EPOCH resolve.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      # Builds every target twice and fails if the two binaries differ, so a
      # release that ships is a release we have proven reproducible.
      - name: Build release artifacts
        env:
          VERSION: ${{ steps.v.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: scripts/build-release.sh

      - name: Verify the built binary runs and reports its version
        run: |
          tar -xzf "dist/onesilo-node_${{ steps.v.outputs.version }}_linux_amd64.tar.gz" \
            -C "$RUNNER_TEMP" ./onesilo-node
          out="$("$RUNNER_TEMP/onesilo-node" -version)"
          echo "$out"
          # A missed ldflags path still compiles and still passes tests — it
          # only shows up here, as the dev/none fallback.
          case "$out" in
            *dev*|*none*) echo "::error::version not stamped: $out"; exit 1 ;;
          esac
          grep -q "${{ steps.v.outputs.version }}" <<<"$out" \
            || { echo "::error::version mismatch: $out"; exit 1; }

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*.tar.gz'

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          REPO='${{ github.repository }}'

          # Previous tag, for the changelog link. Empty on the first release.
          prev="$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || true)"

          # gh rejects more than one of --notes/--notes-file/--generate-notes,
          # so the notes are assembled here rather than mixing flags.
          {
            echo "Binaries for macOS and Linux on amd64 and arm64, plus \`SHA256SUMS\`."
            echo
            echo "Every binary is built twice during release and the build fails if the"
            echo "two differ, so these are reproducible for the tagged commit. Build"
            echo "provenance is attested — verify a download with:"
            echo
            echo '```'
            echo "gh attestation verify onesilo-node_${VERSION}_linux_amd64.tar.gz --repo ${REPO}"
            echo '```'
            echo
            echo "Container image:"
            echo
            echo '```'
            echo "docker pull ghcr.io/${REPO}:${VERSION}"
            echo '```'
            if [ -n "$prev" ]; then
              echo
              echo "**Changelog:** https://github.com/${REPO}/compare/${prev}...${VERSION}"
            fi
          } > "$RUNNER_TEMP/notes.md"

          # Anything with a hyphen after the version core (v0.2.0-rc.1) is a
          # prerelease; plain vX.Y.Z is not.
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            $prerelease \
            dist/*.tar.gz dist/SHA256SUMS

  image:
    name: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push to ghcr.io
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve version and build clock
        id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      # Multi-platform, so this cannot use scripts/build-image.sh — that
      # script's `--output type=docker` is single-platform by design, for
      # local double-build verification. The build args, SOURCE_DATE_EPOCH
      # and rewrite-timestamp below are deliberately identical to it; keep
      # them in step if either changes.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          provenance: false
          outputs: type=image,rewrite-timestamp=true
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            COMMIT=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.v.outputs.epoch }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

      - uses: actions/attest-build-provenance@v2
        if: github.event_name == 'push'
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
